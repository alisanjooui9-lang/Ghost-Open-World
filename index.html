<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Ghost Open World</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Tahoma,Arial,sans-serif;
    background:#05070b;
    color:white;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

.bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 25%,rgba(40,80,120,.28),transparent 35%),
        linear-gradient(180deg,#07101b 0%,#05080d 55%,#020305 100%);
}

.glow{
    position:absolute;
    width:420px;
    height:420px;
    border-radius:50%;
    background:rgba(30,130,190,.12);
    filter:blur(80px);
    top:-150px;
    left:50%;
    transform:translateX(-50%);
}

.grid{
    position:absolute;
    inset:0;
    opacity:.09;
    background-image:
        linear-gradient(rgba(255,255,255,.15) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.15) 1px,transparent 1px);
    background-size:55px 55px;
    transform:perspective(500px) rotateX(62deg) scale(1.8);
    transform-origin:center bottom;
}

.container{
    position:relative;
    z-index:5;
    width:min(92%,470px);
    text-align:center;
}

.logo{
    margin-bottom:25px;
}

.ghost{
    font-size:64px;
    filter:drop-shadow(0 0 18px rgba(70,180,255,.45));
    animation:float 3s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
}

.title{
    font-size:42px;
    font-weight:900;
    letter-spacing:2px;
    margin-top:5px;
    text-shadow:0 0 25px rgba(70,180,255,.35);
}

.subtitle{
    color:#8d9aaa;
    margin-top:10px;
    font-size:14px;
}

.panel{
    margin-top:28px;
    padding:24px;
    border:1px solid rgba(255,255,255,.09);
    background:rgba(10,15,22,.72);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-radius:24px;
    box-shadow:
        0 20px 70px rgba(0,0,0,.5),
        inset 0 1px rgba(255,255,255,.05);
}

.status{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:20px;
}

.statusBox{
    flex:1;
    padding:13px 8px;
    border-radius:14px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.06);
}

.statusIcon{
    font-size:20px;
    margin-bottom:5px;
}

.statusText{
    font-size:11px;
    color:#8792a0;
}

.statusValue{
    font-size:13px;
    margin-top:4px;
    font-weight:bold;
}

.online{
    color:#62e6a7;
}

.buttons{
    display:flex;
    flex-direction:column;
    gap:12px;
}

button{
    width:100%;
    border:none;
    outline:none;
    color:white;
    font-family:inherit;
    font-size:16px;
    font-weight:bold;
    padding:17px;
    border-radius:15px;
    cursor:pointer;
    transition:.18s;
}

button:active{
    transform:scale(.97);
}

.start{
    background:linear-gradient(135deg,#1677b8,#28a9e8);
    box-shadow:0 8px 28px rgba(20,150,220,.28);
}

.start:hover{
    filter:brightness(1.12);
}

.secondary{
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.08);
}

.info{
    margin-top:18px;
    color:#687482;
    font-size:11px;
    line-height:1.9;
}

.version{
    margin-top:18px;
    color:#46515e;
    font-size:10px;
}

.footer{
    position:fixed;
    bottom:14px;
    left:0;
    right:0;
    text-align:center;
    color:#39434e;
    font-size:10px;
    z-index:4;
}

.loading{
    position:fixed;
    inset:0;
    z-index:100;
    background:#030507;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    transition:opacity .5s;
}

.loader{
    width:42px;
    height:42px;
    border:3px solid rgba(255,255,255,.12);
    border-top-color:#32a8e8;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

.loadingText{
    margin-top:15px;
    font-size:12px;
    color:#74808d;
}

@media(max-height:650px){
    .ghost{
        font-size:45px;
    }

    .title{
        font-size:30px;
    }

    .panel{
        margin-top:15px;
        padding:18px;
    }

    .logo{
        margin-bottom:10px;
    }

    button{
        padding:13px;
    }
}
</style>
</head>

<body>

<div class="loading" id="loading">
    <div class="loader"></div>
    <div class="loadingText">در حال آماده‌سازی Ghost Open World...</div>
</div>

<div class="bg">
    <div class="glow"></div>
    <div class="grid"></div>
</div>

<div class="container">

    <div class="logo">
        <div class="ghost">👻</div>
        <div class="title">GHOST</div>
        <div class="subtitle">OPEN WORLD</div>
    </div>

    <div class="panel">

        <div class="status">

            <div class="statusBox">
                <div class="statusIcon">🌍</div>
                <div class="statusText">جهان</div>
                <div class="statusValue">Open World</div>
            </div>

            <div class="statusBox">
                <div class="statusIcon">⚡</div>
                <div class="statusText">نسخه</div>
                <div class="statusValue">0.1.0</div>
            </div>

            <div class="statusBox">
                <div class="statusIcon">●</div>
                <div class="statusText">وضعیت</div>
                <div class="statusValue online">ONLINE</div>
            </div>

        </div>

        <div class="buttons">

            <button class="start" onclick="startGame()">
                ▶ شروع بازی
            </button>

            <button class="secondary" onclick="showInfo()">
                ℹ درباره بازی
            </button>

        </div>

        <div class="info">
            یک جهان سه‌بعدی بزرگ را کشف کن،
            مناطق جدید را پیدا کن و ماجراجویی خودت را شروع کن.
        </div>

        <div class="version">
            Ghost Open World • Mobile Edition
        </div>

    </div>

</div>

<div class="footer">
    👻 Ghost Studio
</div>

<script>

function startGame(){

    const loading = document.getElementById("loading");

    loading.style.opacity = "1";
    loading.style.display = "flex";

    setTimeout(function(){
        window.location.href = "game.html";
    },500);
}

function showInfo(){

    alert(
        "👻 Ghost Open World\n\n" +
        "یک بازی سه‌بعدی جهان‌باز برای موبایل.\n\n" +
        "🌍 نقشه بزرگ\n" +
        "🏔 طبیعت و مناطق مختلف\n" +
        "🏙 شهر و ساختمان‌ها\n" +
        "🌊 آب و رودخانه\n" +
        "🌦 آب‌وهوا و چرخه روز و شب\n" +
        "🎮 کنترل لمسی\n\n" +
        "نسخه اولیه: 0.1.0"
    );

}

window.addEventListener("load",function(){

    setTimeout(function(){

        const loading = document.getElementById("loading");

        loading.style.opacity = "0";

        setTimeout(function(){
            loading.style.display = "none";
        },500);

    },900);

});

</script>

</body>
  </html>
